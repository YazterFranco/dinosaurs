# Compila la app de Android (APK) en cada cambio, la prueba en un teléfono
# virtual y deja el resultado en la rama `apk` del repositorio:
#   DinoRefugio.apk   la app lista para instalar
#   pantalla-*.png    capturas del juego corriendo en el teléfono virtual
#   *.log             registros de la compilación y de la prueba
name: App de Android

on:
  push:
    branches: [main, feature/dino-refugio]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar el APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../compilacion.log

      - name: Publicar el APK en la rama apk
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash android/ci/publicar.sh "compilado"

      - name: Permitir el teléfono virtual (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en un teléfono virtual
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash android/ci/probar.sh

      - name: Publicar el resultado de la prueba
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash android/ci/publicar.sh "probado"
